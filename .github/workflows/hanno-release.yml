# Builds this fork's macOS arm64 desktop app, signed with the fork's
# self-signed certificate, its Windows x64 installer, unsigned, and its Linux x64
# server archive, then publishes them as the newest GitHub release. The desktop app's updater and `t3 update` on
# Linux servers both read this repository's releases.
name: Hanno release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version, for example 0.0.46-hanno.1"
        required: true
        type: string
      ref:
        description: "Commit or branch on hanno to build (default: the branch this runs on)"
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      ref:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: hanno-release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}

jobs:
  prepare:
    name: Check version and commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_REF: ${{ inputs.ref || github.sha }}
    steps:
      - name: Check version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-hanno\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' must look like 0.0.46-hanno.1." >&2
            exit 1
          fi
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists." >&2
            exit 1
          fi

      # The signing certificate only ever signs reviewed code: a manual run may
      # name any ref, so the commit must already be on hanno.
      - name: Resolve the commit on hanno
        id: commit
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init --quiet .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --no-tags --filter=blob:none origin "+refs/heads/hanno:refs/remotes/origin/hanno" "$BUILD_REF"
          sha="$(git rev-parse FETCH_HEAD)"
          if ! git merge-base --is-ancestor "$sha" origin/hanno; then
            echo "::error::$BUILD_REF ($sha) is not on hanno." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  macos:
    name: Build macOS arm64
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    # The signing certificate lives in this environment, which only the hanno
    # branch may deploy to.
    environment: release
    env:
      BUILD_SHA: ${{ needs.prepare.outputs.sha }}
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
      T3CODE_DESKTOP_MAC_SELF_SIGNED_IDENTITY: Hanno Kruger T3 Code
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: ${{ vars.RELAY_URL }}
    steps:
      # actions/checkout's cleanup fails on the orphaned gitlinks in the vendored
      # .repos tree, so this checks out by hand and leaves .repos out.
      - name: Checkout
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$BUILD_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "$VERSION"

      - name: Import signing certificate
        env:
          MAC_SELF_SIGNED_CERTIFICATE: ${{ secrets.MAC_SELF_SIGNED_CERTIFICATE }}
          MAC_SELF_SIGNED_CERTIFICATE_PASSWORD: ${{ secrets.MAC_SELF_SIGNED_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/hanno-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "::add-mask::$keychain_password"
          certificate_bundle="$RUNNER_TEMP/hanno-signing.p12"
          certificate="$RUNNER_TEMP/hanno-signing.pem"
          printf '%s' "$MAC_SELF_SIGNED_CERTIFICATE" | base64 --decode > "$certificate_bundle"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate_bundle" -k "$keychain" -P "$MAC_SELF_SIGNED_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "$T3CODE_DESKTOP_MAC_SELF_SIGNED_IDENTITY" -p "$keychain" > "$certificate"
          # electron-builder only signs with identities that find-identity -v
          # lists, and a self-signed certificate is listed only once trusted.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$certificate"
          rm -f "$certificate_bundle" "$certificate"
          security find-identity -v -p codesigning "$keychain" | tee "$RUNNER_TEMP/identities.txt"
          grep -q "\"$T3CODE_DESKTOP_MAC_SELF_SIGNED_IDENTITY\"" "$RUNNER_TEMP/identities.txt"

      - name: Build desktop artifact
        run: vp run dist:desktop:artifact --platform mac --target dmg --arch arm64 --build-version "$VERSION" --verbose

      - name: Verify signature
        run: |
          set -euo pipefail
          ditto -x -k release/*.zip "$RUNNER_TEMP/shipped"
          app="$(find "$RUNNER_TEMP/shipped" -maxdepth 1 -name '*.app' -type d | head -n 1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -q "^Authority=$T3CODE_DESKTOP_MAC_SELF_SIGNED_IDENTITY$" "$RUNNER_TEMP/codesign.txt"
          codesign -d -r- "$app"
          grep -q "^version: $VERSION$" release/latest-mac.yml

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-macos-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Build Windows x64
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      BUILD_SHA: ${{ needs.prepare.outputs.sha }}
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: ${{ vars.RELAY_URL }}
    steps:
      # actions/checkout's cleanup fails on the orphaned gitlinks in the vendored
      # .repos tree, so this checks out by hand and leaves .repos out.
      - name: Checkout
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$BUILD_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      # The resource monitor links against the Spectre-mitigated MSVC runtime,
      # which the runner image does not install.
      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "$VERSION"

      # Unsigned, because the fork has no Windows code-signing certificate.
      # Without a WSL runtime archive the app runs agents natively on Windows only.
      - name: Build desktop artifact
        run: vp run dist:desktop:artifact --platform win --target nsis --arch x64 --build-version "$VERSION" --verbose

      - name: Verify update manifest
        run: |
          grep -q "^version: $VERSION$" release/latest.yml

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 1

  server-linux-x64:
    name: Build Linux x64 server
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_SHA: ${{ needs.prepare.outputs.sha }}
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: ${{ vars.RELAY_URL }}
    steps:
      - name: Checkout
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$BUILD_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "$VERSION"

      - name: Build server and web client
        run: vp run --filter t3 build

      # Same steps and Node version as upstream's release-desktop.yml; keep
      # VP_NODE_VERSION in step with SEA_NODE_VERSION in apps/server/vite.config.ts.
      - name: Build server single-executable
        env:
          VP_NODE_VERSION: "26.8.2"
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build resource monitor
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$RUNNER_TEMP/cli-resource-monitor/linux-x64/"

      - name: Build server archive
        run: |
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch x64 \
            --version "$VERSION" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Smoke-test server archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "$VERSION"

      - name: Upload server archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: server-linux-x64
          path: release-cli/*
          if-no-files-found: error
          retention-days: 1

  # One release with every asset, so no updater ever sees a release that lacks
  # its own platform's files.
  publish:
    name: Publish release
    needs: [prepare, macos, windows, server-linux-x64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUILD_SHA: ${{ needs.prepare.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        working-directory: release
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(t3-*.tar.gz)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "::error::No server archive was built." >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          assets=(*.dmg *.zip *.exe *.blockmap latest-mac.yml latest.yml "${archives[@]}" SHA256SUMS)
          gh release create "v$VERSION" "${assets[@]}" \
            -R "$GITHUB_REPOSITORY" \
            --target "$BUILD_SHA" \
            --title "T3 Code $VERSION" \
            --notes "macOS arm64 and Windows x64 apps and the Linux x64 server of T3 Code ${VERSION%-hanno.*} with this fork's changes, built from $BUILD_SHA." \
            --latest
