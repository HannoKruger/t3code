# Required gate for pull requests into hanno. Only a sync/<tag> branch of this
# repository that passes the checks the sync itself applies may merge, so a
# sync conflict an agent resolved can land through auto-merge.
#
# It runs on pull_request_target so the definition comes from hanno, never from
# the pull request, which could otherwise rewrite the gate it must pass. It
# never executes code from the pull request: the head is fetched as git data
# and only inspected with git. It has a read-only token, uses no secret and no
# environment. Tests that run the pull request's code live in
# hanno-pull-request-tests.yml.
name: Hanno pull request check

on:
  pull_request_target:
    branches:
      - hanno

permissions:
  contents: read

concurrency:
  group: hanno-pull-request-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  UPSTREAM_REPOSITORY: pingdotgg/t3code
  FORK_BRANCH: hanno
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  verify:
    name: Verify pull request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Accept only branches of this repository
        run: |
          if [[ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Pull requests into $FORK_BRANCH must come from a branch of $GITHUB_REPOSITORY, not $HEAD_REPOSITORY."
            exit 1
          fi

      - name: Fetch hanno, the pull request head and the upstream tags as data
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init --bare --quiet repository.git
          cd repository.git
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git remote add upstream "${GITHUB_SERVER_URL}/${UPSTREAM_REPOSITORY}.git"
          git fetch --quiet --no-tags origin "$HEAD_SHA" "+refs/heads/$FORK_BRANCH:refs/remotes/origin/$FORK_BRANCH"
          git fetch --quiet --no-tags upstream '+refs/tags/v*:refs/tags/v*'

      - name: Verify like the sync does
        working-directory: repository.git
        run: |
          set -euo pipefail
          git show "origin/$FORK_BRANCH:.github/scripts/hanno-sync.sh" > "$RUNNER_TEMP/hanno-sync.sh"
          bash "$RUNNER_TEMP/hanno-sync.sh" check-pull-request "origin/$FORK_BRANCH" "$HEAD_SHA" "$HEAD_BRANCH"
