# Keeps the hanno branch on the newest stable upstream release by merging it
# in, and publishes a new fork release whenever the branch changes. A merge
# conflict pushes and publishes nothing and fails the run in the job
# "Merge conflict with <tag>", which plane-agent-runner turns into a ticket.
name: Hanno upstream sync

on:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches:
      - hanno
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: hanno-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: pingdotgg/t3code
  FORK_BRANCH: hanno

jobs:
  sync:
    name: Merge upstream
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: sync
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      upstream_tag: ${{ steps.merge.outputs.upstream_tag }}
      conflict: ${{ steps.merge.outputs.conflict }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The fork's commits delete upstream's workflows, but copies stay
      # registered from other branches such as main.
      - name: Disable every workflow but the fork's own
        run: |
          set -euo pipefail
          gh workflow list -R "$GITHUB_REPOSITORY" --all --json id,path,state \
            --jq '.[] | select(.state == "active")
              | select(.path | IN(".github/workflows/hanno-release.yml", ".github/workflows/hanno-sync.yml", ".github/workflows/hanno-pull-request-check.yml", ".github/workflows/hanno-pull-request-tests.yml") | not)
              | .id' |
            while read -r workflow_id; do
              gh workflow disable "$workflow_id" -R "$GITHUB_REPOSITORY"
            done

      - name: Checkout
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git config user.name "hanno-sync[bot]"
          git config user.email "hanno-sync@users.noreply.github.com"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags origin "$GITHUB_SHA" "+refs/heads/$FORK_BRANCH:refs/remotes/origin/$FORK_BRANCH" "+refs/tags/*:refs/tags/*"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout -B "$FORK_BRANCH" "origin/$FORK_BRANCH"
          echo "BRANCH_BEFORE_SYNC=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # The merge rewrites the working tree with upstream content, so the steps
      # run a copy of the script taken from this workflow's own commit.
      - name: Copy the sync script
        run: |
          git show "$GITHUB_SHA:.github/scripts/hanno-sync.sh" > "$RUNNER_TEMP/hanno-sync.sh"
          chmod +x "$RUNNER_TEMP/hanno-sync.sh"
          echo "SYNC_SCRIPT=$RUNNER_TEMP/hanno-sync.sh" >> "$GITHUB_ENV"

      - name: Restore rerere cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .git/rr-cache
          key: rerere-${{ github.run_id }}
          restore-keys: rerere-

      - name: Merge the newest stable upstream tag
        id: merge
        run: |
          "$SYNC_SCRIPT" merge
          if ! grep -q '^conflict=true' "$GITHUB_OUTPUT"; then
            "$SYNC_SCRIPT" check-fork-paths "$BRANCH_BEFORE_SYNC"
          fi

      - name: Summarise the conflict
        if: steps.merge.outputs.conflict == 'true'
        env:
          UPSTREAM_TAG: ${{ steps.merge.outputs.upstream_tag }}
        run: |
          {
            echo "## Merging \`$UPSTREAM_TAG\` into \`$FORK_BRANCH\` conflicts"
            echo
            echo "Nothing was pushed or published. Conflicting files, or workflow files the merge would add or change:"
            echo
            sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/conflicts.txt"
            echo
            echo "Resolve it on branch \`sync/$UPSTREAM_TAG\` and open a pull request into \`$FORK_BRANCH\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push branch
        if: steps.merge.outputs.conflict != 'true'
        env:
          DEPLOY_KEY: ${{ secrets.HANNO_SYNC_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/deploy_key"
          trap 'rm -f "$key"' EXIT
          install -m 600 /dev/null "$key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          ssh-keyscan github.com > "$RUNNER_TEMP/known_hosts" 2>/dev/null
          GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts" \
            git push "git@github.com:${GITHUB_REPOSITORY}.git" "$FORK_BRANCH"

      - name: Decide release
        id: release
        if: steps.merge.outputs.conflict != 'true'
        run: '"$SYNC_SCRIPT" decide-release "$UPSTREAM_TAG"'
        env:
          UPSTREAM_TAG: ${{ steps.merge.outputs.upstream_tag }}

  # plane-agent-runner reads this job's name and conclusion through the GitHub
  # API to file a ticket, so the name must stay "Merge conflict with <tag>".
  merge-conflict:
    name: Merge conflict with ${{ needs.sync.outputs.upstream_tag }}
    needs: sync
    if: needs.sync.outputs.conflict == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Fail the run
        env:
          UPSTREAM_TAG: ${{ needs.sync.outputs.upstream_tag }}
        run: |
          echo "::error::Merging $UPSTREAM_TAG into $FORK_BRANCH conflicts. The run summary lists the files."
          exit 1

  release:
    name: Release
    needs: sync
    if: needs.sync.outputs.version != ''
    uses: ./.github/workflows/hanno-release.yml
    # A called workflow only sees its environment's secrets (the signing
    # certificate in `release`) when the caller passes secrets on. The
    # repository itself has no secrets, so nothing else is handed over.
    secrets: inherit
    with:
      version: ${{ needs.sync.outputs.version }}
      ref: ${{ needs.sync.outputs.sha }}
